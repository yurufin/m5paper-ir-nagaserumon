; M5Paper (初代, ESP32) + IR Unit (U002) on PORT.B — 赤外線信号の定期送信
[env:m5paper]
platform = espressif32
board = m5stack-paper
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; 複数台あり COM ポートは都度変わるため固定しない。
; pio run -t upload --upload-port COMx / pio device monitor -p COMx

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
